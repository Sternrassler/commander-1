name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: write
  pull-requests: write
  attestations: write
  id-token: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.12'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.5

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.24']
        include:
          - os: ubuntu-latest
            go-version: '1.24.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -v ./...

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.12'
          check-latest: true

      - name: Read version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=Release ${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 go build -o min-commander-linux-amd64 .
          gzip -k min-commander-linux-amd64

      - name: Build Linux ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build -o min-commander-linux-arm64 .
          gzip -k min-commander-linux-arm64

      - name: Build macOS AMD64
        run: |
          GOOS=darwin GOARCH=amd64 go build -o min-commander-darwin-amd64 .
          gzip -k min-commander-darwin-amd64

      - name: Build macOS ARM64
        run: |
          GOOS=darwin GOARCH=arm64 go build -o min-commander-darwin-arm64 .
          gzip -k min-commander-darwin-arm64

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm

      - name: Build .deb package for Linux AMD64
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x min-commander-linux-amd64
          sed 's/\${ARCH}/amd64/g; s/min-commander-linux-amd64/min-commander-linux-amd64/g' nfpm.yaml > nfpm-linux-amd64.yaml
          nfpm package --config nfpm-linux-amd64.yaml --packager deb --target min-commander_${VERSION}_amd64.deb

      - name: Build .deb package for Linux ARM64
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x min-commander-linux-arm64
          sed 's/\${ARCH}/arm64/g; s/min-commander-linux-amd64/min-commander-linux-arm64/g' nfpm.yaml > nfpm-linux-arm64.yaml
          nfpm package --config nfpm-linux-arm64.yaml --packager deb --target min-commander_${VERSION}_arm64.deb

      - name: Generate Checksums
        run: |
          sha256sum \
            min-commander-linux-amd64.gz \
            min-commander-linux-arm64.gz \
            min-commander-darwin-amd64.gz \
            min-commander-darwin-arm64.gz \
            min-commander_${{ steps.version.outputs.VERSION }}_amd64.deb \
            min-commander_${{ steps.version.outputs.VERSION }}_arm64.deb \
            > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.RELEASE_NAME }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            min-commander-linux-amd64.gz
            min-commander-linux-arm64.gz
            min-commander-darwin-amd64.gz
            min-commander-darwin-arm64.gz
            min-commander_${{ steps.version.outputs.VERSION }}_amd64.deb
            min-commander_${{ steps.version.outputs.VERSION }}_arm64.deb
            checksums.txt

  release-macos-pkg:
    name: Build & Upload macOS PKG
    runs-on: macos-latest
    needs: [release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.12'
          check-latest: true

      - name: Read version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build macOS ARM64
        run: GOOS=darwin GOARCH=arm64 go build -o min-commander-darwin-arm64 .

      - name: Create pkg directory structure
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp min-commander-darwin-arm64 pkgroot/usr/local/bin/min-commander
          chmod +x pkgroot/usr/local/bin/min-commander

      - name: Build .pkg installer
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          pkgbuild \
            --root pkgroot \
            --identifier com.karstenflache.min-commander \
            --version $VERSION \
            --install-location / \
            min-commander_${VERSION}_darwin-arm64.pkg

      - name: Upload .pkg to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: min-commander_${{ steps.version.outputs.VERSION }}_darwin-arm64.pkg

  homebrew-update:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [release-macos-pkg]
    steps:
      - name: Bump Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: sternrassler/homebrew-tap
          formula: min-commander
